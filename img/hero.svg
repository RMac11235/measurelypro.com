<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-labelledby="hero-title">
  <title id="hero-title">A house measured with a tape</title>
  <!-- soft ground -->
  <ellipse cx="260" cy="348" rx="230" ry="28" fill="#14110e" opacity=".55"/>
  <!-- chimney -->
  <rect x="332" y="86" width="28" height="86" fill="#3a3228"/>
  <rect x="326" y="78" width="40" height="12" rx="1" fill="#2a241c"/>
  <!-- roof -->
  <polygon points="70,188 260,64 450,188" fill="#1b1713"/>
  <polygon points="88,188 260,82 432,188" fill="#2a241c"/>
  <polygon points="260,64 450,188 432,188 260,82" fill="#14110e"/>
  <!-- fascia -->
  <polygon points="70,188 450,188 438,200 82,200" fill="#c8882a"/>
  <!-- house body -->
  <rect x="96" y="200" width="328" height="148" fill="#8a5a2b"/>
  <!-- wood siding lines -->
  <g stroke="#7a4e24" stroke-width="1" opacity=".7">
    <line x1="96" y1="220" x2="424" y2="220"/>
    <line x1="96" y1="240" x2="424" y2="240"/>
    <line x1="96" y1="260" x2="424" y2="260"/>
    <line x1="96" y1="280" x2="424" y2="280"/>
    <line x1="96" y1="300" x2="424" y2="300"/>
    <line x1="96" y1="320" x2="424" y2="320"/>
  </g>
  <!-- corner boards -->
  <rect x="96" y="200" width="10" height="148" fill="#c8882a"/>
  <rect x="414" y="200" width="10" height="148" fill="#6e4722"/>
  <!-- left window -->
  <rect x="128" y="224" width="72" height="72" fill="#1b1713"/>
  <rect x="134" y="230" width="60" height="60" fill="#f6efe3"/>
  <line x1="164" y1="230" x2="164" y2="290" stroke="#1b1713" stroke-width="3"/>
  <line x1="134" y1="260" x2="194" y2="260" stroke="#1b1713" stroke-width="3"/>
  <rect x="128" y="224" width="72" height="8" fill="#2a241c"/>
  <!-- right window -->
  <rect x="320" y="224" width="72" height="72" fill="#1b1713"/>
  <rect x="326" y="230" width="60" height="60" fill="#f6efe3"/>
  <line x1="356" y1="230" x2="356" y2="290" stroke="#1b1713" stroke-width="3"/>
  <line x1="326" y1="260" x2="386" y2="260" stroke="#1b1713" stroke-width="3"/>
  <rect x="320" y="224" width="72" height="8" fill="#2a241c"/>
  <!-- door -->
  <rect x="226" y="236" width="68" height="112" fill="#1b1713"/>
  <rect x="232" y="242" width="56" height="106" fill="#5c3a1c"/>
  <rect x="238" y="250" width="20" height="28" fill="#d7c4a0"/>
  <rect x="262" y="250" width="20" height="28" fill="#d7c4a0"/>
  <rect x="238" y="284" width="20" height="28" fill="#d7c4a0"/>
  <rect x="262" y="284" width="20" height="28" fill="#d7c4a0"/>
  <circle cx="280" cy="300" r="3.5" fill="#f0c400"/>
  <!-- stoop -->
  <rect x="214" y="348" width="92" height="10" fill="#3a3228"/>
  <rect x="222" y="338" width="76" height="10" fill="#4a4034"/>
  <!-- tape case (right) -->
  <g transform="translate(428,312)">
    <circle cx="28" cy="28" r="28" fill="#f0c400"/>
    <circle cx="28" cy="28" r="22" fill="#e0b400"/>
    <circle cx="28" cy="28" r="10" fill="#1b1713"/>
    <circle cx="28" cy="28" r="5" fill="#c8882a"/>
    <rect x="-2" y="20" width="12" height="16" rx="2" fill="#c8c4bc"/>
  </g>
  <!-- tape blade -->
  <rect x="48" y="332" width="390" height="16" fill="#f0c400"/>
  <rect x="48" y="346" width="390" height="2" fill="#1b1713"/>
  <!-- hook -->
  <path d="M48 332 h-10 v20 h14 v-6 h-8 v-8 h4 z" fill="#c8c4bc"/>
  <!-- blade ticks -->
  <g stroke="#1b1713" stroke-width="1.2">
    <line x1="70" y1="332" x2="70" y2="344"/>
    <line x1="94" y1="332" x2="94" y2="340"/>
    <line x1="118" y1="332" x2="118" y2="340"/>
    <line x1="142" y1="332" x2="142" y2="344"/>
    <line x1="166" y1="332" x2="166" y2="340"/>
    <line x1="190" y1="332" x2="190" y2="340"/>
    <line x1="214" y1="332" x2="214" y2="344"/>
    <line x1="238" y1="332" x2="238" y2="340"/>
    <line x1="262" y1="332" x2="262" y2="340"/>
    <line x1="286" y1="332" x2="286" y2="344"/>
    <line x1="310" y1="332" x2="310" y2="340"/>
    <line x1="334" y1="332" x2="334" y2="340"/>
    <line x1="358" y1="332" x2="358" y2="344"/>
    <line x1="382" y1="332" x2="382" y2="340"/>
    <line x1="406" y1="332" x2="406" y2="340"/>
  </g>
  <text x="146" y="343" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#1b1713">10</text>
  <text x="214" y="343" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#1b1713">16</text>
  <text x="282" y="343" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#1b1713">22</text>
  <text x="354" y="343" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#1b1713">28</text>
</svg>
